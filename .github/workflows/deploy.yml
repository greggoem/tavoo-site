# Deploiement automatique du dossier site/ vers le serveur, a chaque push sur main.
# Identifiants a declarer dans : Settings > Secrets and variables > Actions
#   FTP_SERVER    adresse du serveur FTP
#   FTP_USERNAME
#   FTP_PASSWORD
name: Deploiement tavoo.be

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Envoyer site/ sur le serveur
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: /tavoo/
          # Passer a "ftps" si le serveur le supporte (recommande)
          protocol: ftp
          dangerous-clean-slate: false
